<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Studio — Ether</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0f0f0f; color: #f0f0f0;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .card {
      background: #1a1a1a; border: 1px solid #2a2a2a;
      padding: 28px; width: 100%; max-width: 480px;
    }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; letter-spacing: 0.02em; }
    .sub { font-size: 12px; color: #888; margin-bottom: 20px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #aaa; margin-bottom: 4px; letter-spacing: 0.06em; text-transform: uppercase; }
    input, select {
      width: 100%; padding: 8px 10px; background: #0f0f0f;
      border: 1px solid #333; color: #f0f0f0; font-size: 13px;
      outline: none; margin-bottom: 14px;
    }
    input:focus, select:focus { border-color: #3b82f6; }
    button {
      width: 100%; padding: 10px; background: #3b82f6; border: none;
      color: #fff; font-size: 13px; font-weight: 700; cursor: pointer;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    button:disabled { background: #374151; color: #6b7280; cursor: not-allowed; }
    button:not(:disabled):hover { background: #2563eb; }
    #preview { width: 100%; aspect-ratio: 16/9; background: #000; object-fit: cover; margin-bottom: 14px; display: none; }
    #status {
      font-size: 12px; padding: 8px 10px; background: #111;
      border: 1px solid #2a2a2a; color: #888; margin-top: 12px;
      min-height: 38px; display: none;
    }
    #status.ok  { border-color: #22c55e; color: #22c55e; }
    #status.err { border-color: #ef4444; color: #ef4444; }
    .level-bar { height: 4px; background: #222; margin-bottom: 14px; }
    .level-fill { height: 100%; background: #22c55e; width: 0%; transition: width 0.05s; }
    .connected-view { display: none; }
    .connected-view.show { display: block; }
    .setup-view.hide { display: none; }
    .remote-videos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .remote-tile { background: #111; aspect-ratio: 16/9; border: 1px solid #2a2a2a; overflow: hidden; position: relative; }
    .remote-tile video { width: 100%; height: 100%; object-fit: cover; }
    .remote-tile .name { position: absolute; bottom: 4px; left: 6px; font-size: 10px; color: #fff; background: rgba(0,0,0,0.6); padding: 2px 5px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Join Studio</h1>
    <p class="sub">You've been invited to join a live podcast session.</p>

    <div class="setup-view" id="setupView">
      <label>Your Name</label>
      <input type="text" id="guestName" placeholder="e.g. Jane Smith" value="" />

      <label>Camera</label>
      <select id="camSel"></select>

      <label>Microphone</label>
      <select id="micSel"></select>

      <video id="preview" autoplay muted playsinline></video>
      <div class="level-bar"><div class="level-fill" id="levelFill"></div></div>

      <button id="joinBtn" disabled>Join Now</button>
    </div>

    <div class="connected-view" id="connectedView">
      <video id="localVid" autoplay muted playsinline style="width:100%;aspect-ratio:16/9;background:#000;object-fit:cover;"></video>
      <div class="level-bar" style="margin-top:8px;"><div class="level-fill" id="levelFill2"></div></div>
      <div id="status" class="ok" style="display:block;">Connected to studio. You are live.</div>
      <div class="remote-videos" id="remoteTiles"></div>
      <button id="leaveBtn" style="margin-top:14px;background:#ef4444;">Leave Session</button>
    </div>
  </div>

  <script>
  (function() {
    const params = new URLSearchParams(location.search);
    const token  = params.get("s") || "";

    let localStream = null;
    let ws          = null;
    let myId        = null;
    let peers       = {};   // peerId -> RTCPeerConnection
    let analyser    = null;
    let animFrame   = null;

    // ── Device enumeration ──────────────────────────────────────
    async function enumerateDevices() {
      try {
        await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
        const devices = await navigator.mediaDevices.enumerateDevices();
        const camSel  = document.getElementById("camSel");
        const micSel  = document.getElementById("micSel");
        camSel.innerHTML = "";
        micSel.innerHTML = "";
        devices.filter(d => d.kind === "videoinput").forEach(d => {
          const o = document.createElement("option");
          o.value = d.deviceId; o.text = d.label || "Camera " + (camSel.options.length + 1);
          camSel.appendChild(o);
        });
        devices.filter(d => d.kind === "audioinput").forEach(d => {
          const o = document.createElement("option");
          o.value = d.deviceId; o.text = d.label || "Microphone " + (micSel.options.length + 1);
          micSel.appendChild(o);
        });
        await startPreview();
      } catch(e) {
        showStatus("Camera/mic permission denied: " + e.message, "err");
      }
    }

    async function startPreview() {
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      const camId = document.getElementById("camSel").value;
      const micId = document.getElementById("micSel").value;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: camId ? { deviceId: { exact: camId } } : true,
          audio: micId ? { deviceId: { exact: micId } } : true,
        });
        const preview = document.getElementById("preview");
        preview.srcObject = localStream;
        preview.style.display = "block";
        document.getElementById("joinBtn").disabled = false;
        startLevelMeter(localStream, "levelFill");
      } catch(e) { showStatus("Could not access camera: " + e.message, "err"); }
    }

    function startLevelMeter(stream, fillId) {
      try {
        const ctx  = new AudioContext();
        const src  = ctx.createMediaStreamSource(stream);
        analyser   = ctx.createAnalyser();
        analyser.fftSize = 256;
        src.connect(analyser);
        const buf  = new Uint8Array(analyser.frequencyBinCount);
        const fill = document.getElementById(fillId);
        const tick = () => {
          analyser.getByteFrequencyData(buf);
          const avg = buf.reduce((a, b) => a + b, 0) / buf.length;
          const pct = (avg / 128) * 100;
          fill.style.width = pct + "%";
          fill.style.background = pct > 85 ? "#ef4444" : pct > 60 ? "#f59e0b" : "#22c55e";
          animFrame = requestAnimationFrame(tick);
        };
        tick();
      } catch {}
    }

    // ── WebSocket signaling ─────────────────────────────────────
    function connect() {
      const host    = location.hostname;
      const wsUrl   = "ws://" + host + ":9091/signal?role=guest&token=" + encodeURIComponent(token);
      const name    = document.getElementById("guestName").value.trim() || "Guest";

      document.getElementById("setupView").classList.add("hide");
      document.getElementById("connectedView").classList.add("show");
      document.getElementById("localVid").srcObject = localStream;
      startLevelMeter(localStream, "levelFill2");

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        // Announce ourselves
        ws.send(JSON.stringify({ type: "hello", name }));
      };

      ws.onmessage = async (ev) => {
        const msg = JSON.parse(ev.data);

        if (msg.type === "welcome") {
          myId = msg.id;
          // Send offer to host
          await sendOffer("host", name);
        } else if (msg.type === "answer") {
          const pc = peers[msg.from] || peers["host"];
          if (pc) await pc.setRemoteDescription(msg.payload);
        } else if (msg.type === "ice") {
          const pc = peers[msg.from] || peers["host"];
          if (pc && msg.payload) try { await pc.addIceCandidate(msg.payload); } catch {}
        } else if (msg.type === "guest-joined") {
          // Another guest joined — connect to them too
          await sendOffer(msg.from, name);
        }
      };

      ws.onclose = () => { showStatus("Disconnected from studio.", "err"); };
    }

    async function sendOffer(toId, name) {
      const pc = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
      });
      peers[toId] = pc;

      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

      pc.ontrack = (e) => addRemoteTile(toId, e.streams[0]);

      pc.onicecandidate = (e) => {
        if (e.candidate && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ to: toId === "host" ? null : toId, type: "ice", payload: e.candidate, toHost: toId === "host" }));
        }
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      ws.send(JSON.stringify({ to: toId === "host" ? null : toId, toHost: toId === "host", type: "offer", payload: offer, name }));
    }

    function addRemoteTile(peerId, stream) {
      const existing = document.getElementById("tile-" + peerId);
      if (existing) { existing.querySelector("video").srcObject = stream; return; }
      const div = document.createElement("div");
      div.className = "remote-tile";
      div.id = "tile-" + peerId;
      const vid = document.createElement("video");
      vid.autoplay = true; vid.playsinline = true; vid.srcObject = stream;
      const name = document.createElement("div");
      name.className = "name"; name.textContent = peerId === "host" ? "Host" : "Guest";
      div.appendChild(vid); div.appendChild(name);
      document.getElementById("remoteTiles").appendChild(div);
    }

    function showStatus(msg, cls) {
      const el = document.getElementById("status");
      el.textContent = msg; el.className = cls; el.style.display = "block";
    }

    // ── Device change handlers ──────────────────────────────────
    document.getElementById("camSel").onchange = startPreview;
    document.getElementById("micSel").onchange = startPreview;

    document.getElementById("joinBtn").onclick = () => {
      const name = document.getElementById("guestName").value.trim();
      if (!name) { document.getElementById("guestName").focus(); return; }
      connect();
    };

    document.getElementById("leaveBtn").onclick = () => {
      if (ws) { try { ws.send(JSON.stringify({ type: "leave" })); ws.close(); } catch {} }
      Object.values(peers).forEach(pc => pc.close());
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      cancelAnimationFrame(animFrame);
      showStatus("You have left the session.", "");
    };

    // ── Enter key on name field ─────────────────────────────────
    document.getElementById("guestName").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("joinBtn").click();
    });

    // ── Init ───────────────────────────────────────────────────
    enumerateDevices();
  })();
  </script>
</body>
</html>
