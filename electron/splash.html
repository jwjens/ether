<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 820px;
    height: 480px;
    background: transparent;
    overflow: hidden;
    font-family: monospace;
  }

  .card {
    width: 820px;
    height: 480px;
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    border: 1px solid rgba(136, 104, 216, 0.3);
    box-shadow: 0 0 60px rgba(0,0,0,0.9), 0 0 30px rgba(136,104,216,0.12);
    position: relative;
  }

  .left {
    width: 45%;
    height: 100%;
    background: #08080f;
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 32px 28px;
    overflow: hidden;
    z-index: 2;
  }

  .left-content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: flex-start;   /* left-align the atom + wordmark (default stretch was offsetting the wordmark) */
    height: 100%;
  }

  .wordmark-img {
    height: 60px;
    width: auto;
    display: block;
    margin-left: -4px;   /* compensate the wordmark SVG's viewBox left padding so it sits flush under the atom */
    margin-bottom: 2px;
  }

  .log {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 4px;
    margin-top: 20px;
  }

  .log-line {
    font-family: 'DM Mono', 'Consolas', 'Courier New', monospace;
    font-size: 11px;
    color: #c084fc;
    opacity: 0;
    transition: opacity 0.3s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .log-line::before {
    content: "›";
    color: #8868d8;
    font-weight: 700;
  }
  .log-line.visible { opacity: 0.95; }
  .log-line.ready { color: #ffffff; }
  .log-line.ready::before { content: "✓"; color: #34d399; }

  .copyright {
    font-size: 9px;
    color: #374151;
    margin-top: 12px;
  }

  .right {
    width: 55%;
    height: 100%;
    position: relative;
    overflow: hidden;
    margin-left: -2px;
  }

  .right img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: perspective(700px) rotateY(-15deg) scale(1.2);
    transform-origin: right center;
    filter: saturate(1.4) contrast(1.15) brightness(0.8);
  }

  .right-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, #08080f 0%, rgba(8,8,15,0.8) 20%, transparent 55%);
    z-index: 2;
  }

  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 1px, transparent 3px);
    z-index: 3;
  }
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <div class="left-content">
      <img src="./assets/icon.png" width="64" height="64" style="margin-bottom: 14px; display: block;" alt="" />
      <img class="wordmark-img" src="./assets/ethercast-wordmark.svg" alt="EtherCast" />
      <div class="log" id="log"></div>
      <div class="copyright">© 2026 Ether Technologies</div>
    </div>
  </div>
  <div class="right">
    <img src="./assets/splash-artwork.png" alt="" />
    <div class="right-overlay"></div>
    <div class="scanlines"></div>
  </div>
</div>

<script>
  // Real load status — driven by the main process (and renderer) over IPC. No theater:
  // each line is an actual startup milestone, and the splash closes when the app is ready.
  const logEl = document.getElementById("log");
  function addLine(msg) {
    if (!msg) return;
    const div = document.createElement("div");
    div.className = "log-line" + (/^ready/i.test(msg) ? " ready" : "");
    div.textContent = msg;
    logEl.appendChild(div);
    requestAnimationFrame(() => div.classList.add("visible"));
    while (logEl.children.length > 7) logEl.removeChild(logEl.firstChild);
  }
  if (window.splash && window.splash.onStatus) {
    window.splash.onStatus(addLine);
  } else {
    // Fallback (no preload): a single honest line rather than fake scrolling code.
    addLine("Loading…");
  }
</script>
</body>
</html>
