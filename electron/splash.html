<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 340px; height: 340px;
      background: #0e0e14;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .logo {
      width: 180px; height: 180px;
      opacity: 0;
      animation: fadeIn 0.5s ease 0.1s forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }
  </style>
</head>
<body>
  <svg class="logo" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
    <rect fill="#0e0e14" width="256" height="256" rx="48"/>
    <g transform="translate(128,128) rotate(-7)">
      <ellipse fill="none" stroke="#9070d0" stroke-width="5" rx="88" ry="33"/>
      <ellipse fill="none" stroke="#9070d0" stroke-width="5" rx="88" ry="33" transform="rotate(60)"/>
      <ellipse fill="none" stroke="#9070d0" stroke-width="5" rx="88" ry="33" transform="rotate(-60)"/>
      <circle fill="#c8a8f0" cx="0" cy="-88" r="8"/>
      <circle fill="#c8a8f0" cx="76.2" cy="44" r="8"/>
      <circle fill="#5030a0" cx="0" cy="88" r="6"/>
      <circle fill="#5030a0" cx="-76.2" cy="-44" r="6"/>
      <polygon fill="#c8b8e8" opacity="0.2" points="0,-38 30,5 0,18 -30,5"/>
      <polygon fill="none" stroke="#e0d0f8" stroke-width="3.5" stroke-linejoin="round" points="0,-38 30,5 0,18 -30,5"/>
      <polygon fill="none" stroke="#7858b8" stroke-width="2.5" stroke-linejoin="round" points="0,38 30,5 0,18 -30,5"/>
      <line stroke="#a888d8" stroke-width="2" opacity="0.8" x1="0" y1="-38" x2="0" y2="18"/>
      <line stroke="#a888d8" stroke-width="2" opacity="0.8" x1="-30" y1="5" x2="30" y2="5"/>
      <line stroke="#a888d8" stroke-width="2" opacity="0.8" x1="-30" y1="5" x2="0" y2="38"/>
      <line stroke="#a888d8" stroke-width="2" opacity="0.8" x1="30" y1="5" x2="0" y2="38"/>
    </g>
  </svg>
</body>
</html>
