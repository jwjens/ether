[package]
name = "ether-audio"
version = "1.0.0"
edition = "2021"
description = "Ether native audio engine — NAPI addon for Electron"

[lib]
crate-type = ["cdylib"]

[dependencies]
# NAPI — Node.js native addon interface
napi        = { version = "2", features = ["napi4", "tokio_rt"] }
napi-derive = "2"

# Audio playback — same as Tauri version, unchanged
rodio     = { version = "0.19", features = ["mp3", "flac", "wav", "vorbis"] }
symphonia = { version = "0.5",  features = ["mp3", "flac", "ogg", "wav", "aac", "isomp4"] }
ebur128   = "0.1"

# cpal — ASIO enabled on Windows only (ASIO is Windows-specific and breaks Mac/Linux builds)
[target.'cfg(windows)'.dependencies]
cpal = { version = "0.15", features = ["asio"] }

[target.'cfg(not(windows))'.dependencies]
cpal = { version = "0.15" }

# DSP
rustfft  = "6"
realfft  = "3"

# Serialization
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP (for dashboard server)
tiny_http = "0.12"
ureq      = "2.10"

# Async runtime
tokio = { version = "1", features = ["full"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true
