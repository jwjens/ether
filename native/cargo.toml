[package]
name = "ether-audio"
version = "1.0.0"
edition = "2021"
description = "Ether native audio engine — NAPI addon for Electron"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# NAPI — Node.js native addon interface
napi        = { version = "2", features = ["napi4", "tokio_rt"] }
napi-derive = "2"

# Audio playback
rodio     = { version = "0.19", features = ["mp3", "flac", "wav", "vorbis"] }
symphonia = { version = "0.5",  features = ["mp3", "flac", "ogg", "wav", "aac", "isomp4"] }
ebur128   = "0.1"

# DSP
rustfft  = "6"
realfft  = "3"
ringbuf  = "0.4"

# Serialization
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP (for dashboard server)
tiny_http = "0.12"
ureq      = "2.10"

# REMOTE LINK (docs/remote-link-design-2026-09-28.md) — Opus (libopus, built from source by CMake: CI runners
# have it on PATH; locally the Visual Studio Build Tools copy via the CMAKE env var), the per-packet key check
# (ChaCha20-Poly1305, pure Rust), and OS randomness for session ids and link keys.
opus             = "0.4"
chacha20poly1305 = "0.10"
getrandom        = "0.2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# cpal — ASIO enabled on Windows only (requires Steinberg ASIO SDK at build time)
# ASIO removed for dev builds until SDK is available; WASAPI covers B1 requirements.
[target.'cfg(windows)'.dependencies]
cpal = { version = "0.15" }

[target.'cfg(not(windows))'.dependencies]
cpal = { version = "0.15" }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true
