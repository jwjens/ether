[package]
name = "openair"
version = "1.5.2"
edition = "2021"
description = "Free broadcast automation"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Enable MP3 encoding for Icecast streaming
# Ubuntu/Debian: sudo apt install libmp3lame-dev
# macOS:         brew install lame
# Windows:       vcpkg install mp3lame
mp3 = ["mp3lame-encoder"]

[dependencies]
tauri               = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-sql    = { version = "2.0.0", features = ["sqlite"] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs     = "2.0.0"
tauri-plugin-autostart = "2"

# Audio playback — native WASAPI/CoreAudio via CPAL (no Windows mixer in path)
rodio     = { version = "0.19", features = ["mp3", "flac", "wav", "vorbis"] }
cpal      = { version = "0.15", features = ["asio"] }    # ASIO on Windows, CoreAudio on Mac
symphonia = { version = "0.5",  features = ["mp3", "flac", "ogg", "wav", "aac", "isomp4"] }
ebur128   = "0.1"

# DSP — for phase vocoder and future spectral processing
rustfft   = "6"        # Fast Fourier Transform (replaces naive DFT in audio_engine.rs)
realfft   = "3"        # Real-valued FFT optimization for audio

# Streaming — MP3 encoding for Icecast (optional, requires libmp3lame)
mp3lame-encoder = { version = "0.1", optional = true }

# Serialization
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP
tiny_http = "0.12"
ureq      = "2.10"

# Video engine — Windows native (Phase 1: DXGI screen capture + engine scaffold)
bytemuck          = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
jpeg-encoder      = "0.6"
uuid              = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_Foundation",
] }
