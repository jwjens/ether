[package]
name = "openair"
version = "1.5.2"
edition = "2021"
description = "Free broadcast automation"

[build-dependencies]
tauri-build = { version = "2", features = [] }


[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2.0.0", features = ["sqlite"] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-autostart = "2"
rodio = { version = "0.19", features = ["mp3", "flac", "wav", "vorbis"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ebur128 = "0.1"
symphonia = { version = "0.5", features = ["mp3", "flac", "ogg", "wav", "aac", "isomp4"] }
tiny_http = "0.12"
