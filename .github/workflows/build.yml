name: Build Ether

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── THE TEST GATE ────────────────────────────────────────────────────────────────────────────
  # A release cannot be built without the unit tests passing. This runs ONCE, on the cheapest
  # runner, and all three platform builds hang off it via `needs:` — a per-job step would run the
  # same platform-independent suite three times and still let a green Windows build publish
  # alongside a red one.
  #
  # WHY THE SUITE MUST STAY GREEN LOCALLY TOO: this workflow only fires on a v* tag, so anything
  # that breaks between tags surfaces here, at the moment of release, when it is most expensive.
  # `npx vitest run` exits 0 as of the hygiene arc; keep it that way.
  #
  # `npm run test:sync` is NOT run here — see the note on that step below.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Node dependencies
        run: npm install

      # vite/esbuild STRIP types and never typecheck, so this is the only gate that catches a
      # prop-type or "not defined" crash before it ships. It ran on zero accepted errors as of
      # 4.4.179 — the two long-standing ones (OnboardingFlow, PhoneDesk) are fixed, and one of them
      # was a real bug: an onboarding screen whose label was undefined at runtime.
      #
      # Keep this at ZERO. A remembered baseline is not a gate — it holds only while someone recalls
      # the number, and it silently absorbs the next error.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (renderer + audiod)
        run: npx vitest run

      # NOT GATED HERE, deliberately, and neither is a lie of omission:
      #
      # · `npm run test:sync` runs under `electron --no-sandbox`, needs better-sqlite3 rebuilt for
      #   Electron's ABI, and needs xvfb on Linux. That is an Electron download plus a native
      #   rebuild before a single assertion runs, and a headless-display flake would block a
      #   release for a reason unrelated to the release. LOCAL-ONLY, run before a sync change.
      #
      # (`npx tsc --noEmit` DOES gate now — see the Typecheck step above. The 2 accepted errors that
      # blocked it were fixed in 4.4.179.)
      #
      # Recorded in docs/backlog.md rather than left as folklore.

  build:
    needs: test
    strategy:
      # Publish is racy: every matrix job runs `electron-builder --publish always`,
      # and each tries to POST /releases for the tag. Whoever wins creates it; the
      # others get 422 "already_exists". Serialize the matrix so the first job creates
      # the release and the rest find it + upload into it (the same path re-runs use).
      max-parallel: 1
      # Don't let one platform's failure cancel the others mid-publish.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Station-identity leak guard (mandatory)
        run: node scripts/test-station-identity-leak.js

      - name: Station audio-isolation guard (DESIGN-TRUTH §2, mandatory)
        run: node scripts/check-no-global-audio-statics.js

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Generate icon.icns (Mac)
        if: matrix.platform == 'mac'
        run: |
          mkdir -p build-resources/icon.iconset
          sips -z 16 16     build-resources/icon.png --out build-resources/icon.iconset/icon_16x16.png
          sips -z 32 32     build-resources/icon.png --out build-resources/icon.iconset/icon_16x16@2x.png
          sips -z 32 32     build-resources/icon.png --out build-resources/icon.iconset/icon_32x32.png
          sips -z 64 64     build-resources/icon.png --out build-resources/icon.iconset/icon_32x32@2x.png
          sips -z 128 128   build-resources/icon.png --out build-resources/icon.iconset/icon_128x128.png
          sips -z 256 256   build-resources/icon.png --out build-resources/icon.iconset/icon_128x128@2x.png
          sips -z 256 256   build-resources/icon.png --out build-resources/icon.iconset/icon_256x256.png
          sips -z 512 512   build-resources/icon.png --out build-resources/icon.iconset/icon_256x256@2x.png
          sips -z 512 512   build-resources/icon.png --out build-resources/icon.iconset/icon_512x512.png
          sips -z 1024 1024 build-resources/icon.png --out build-resources/icon.iconset/icon_512x512@2x.png
          iconutil -c icns build-resources/icon.iconset --output build-resources/icon.icns

      - name: Rename cargo.toml on Unix
        if: matrix.platform != 'win'
        working-directory: native
        run: if [ -f cargo.toml ]; then mv cargo.toml Cargo.toml; fi
        shell: bash

      - name: Rename cargo.toml on Windows
        if: matrix.platform == 'win'
        working-directory: native
        run: if (Test-Path cargo.toml) { Rename-Item cargo.toml Cargo.toml }
        shell: pwsh

      - name: Build native audio addon
        working-directory: native
        run: cargo build --release

      - name: Copy native addon (Windows)
        if: matrix.platform == 'win'
        run: Copy-Item native/target/release/ether_audio.dll native/ether-audio.node
        shell: pwsh

      - name: Copy native addon (Mac/Linux)
        if: matrix.platform != 'win'
        run: |
          cp native/target/release/libether_audio.dylib native/ether-audio.node 2>/dev/null || \
          cp native/target/release/libether_audio.so native/ether-audio.node 2>/dev/null || true
        shell: bash

      - name: Install Node dependencies
        run: npm install

      - name: Rebuild native Node modules for Electron
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build Vite
        run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_VERSION: ${{ github.ref_name }}

      - name: Build and publish (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: false

      - name: Build and publish (Mac)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: false

      - name: Build and publish (Linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: false