name: Build Ether

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Build native audio addon
        working-directory: native
        run: |
          if [ -f cargo.toml ]; then mv cargo.toml Cargo.toml; fi
          cargo build --release

      - name: Copy native addon (Windows)
        if: matrix.platform == 'win'
        run: Copy-Item native/target/release/ether_audio.dll native/ether-audio.node
        shell: pwsh

      - name: Copy native addon (Mac/Linux)
        if: matrix.platform != 'win'
        run: |
          cp native/target/release/libether_audio.dylib native/ether-audio.node 2>/dev/null || \
          cp native/target/release/libether_audio.so native/ether-audio.node 2>/dev/null || true
        shell: bash

      - name: Install Node dependencies
        run: npm ci

      - name: Build Vite
        run: npm run build

      - name: Build and publish (Windows)
        if: matrix.platform == 'win'
        run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: true

      - name: Build and publish (Mac)
        if: matrix.platform == 'mac'
        run: npm run electron:build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: true

      - name: Build and publish (Linux)
        if: matrix.platform == 'linux'
        run: npm run electron:build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: true