name: Build Ether

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            name: Windows
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            name: macOS Apple Silicon
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            name: macOS Intel

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Ether ${{ github.ref_name }}'
          releaseBody: |
            ## Ether ${{ github.ref_name }}

            Free broadcast automation for radio stations, theme parks, and venues.

            ### Downloads
            - **Windows:** Download the `.msi` file
            - **Mac (Apple Silicon M1/M2/M3):** Download the `aarch64.dmg` file
            - **Mac (Intel):** Download the `x86_64.dmg` file

            ### Windows Installation Note
            Windows may show a security warning. Click **"More info"** → **"Run anyway"** to install.

            ### Mac Installation Note
            Mac may show a Gatekeeper warning. Right-click the app → **Open** → **Open** to install.

            ### What's New
            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
