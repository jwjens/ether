<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #080810; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
</style>
</head>
<body>
<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="400" fill="#080810"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#080810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="680" height="400" fill="url(#glow)"/>

  <!-- Logo icon -->
  <rect x="290" y="60" width="100" height="100" rx="26" fill="url(#logoGrad)"/>
  <path d="M304 110 C313 94 322 94 331 110 C340 126 349 126 358 110 C367 94 372 94 376 110"
    stroke="#080810" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Wordmark -->
  <text x="340" y="208" text-anchor="middle"
    font-family="'Syne', 'Inter', system-ui, sans-serif"
    font-size="32" font-weight="800" letter-spacing="-0.5"
    fill="#f0f0f8">ETHER TECHNOLOGIES</text>

  <!-- STATION badge -->
  <rect x="264" y="224" width="152" height="28" rx="14" fill="#a78bfa" opacity="0.15"/>
  <rect x="264" y="224" width="152" height="28" rx="14" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.4"/>
  <text x="340" y="243" text-anchor="middle"
    font-family="'Inter', system-ui, sans-serif"
    font-size="12" font-weight="700" letter-spacing="3"
    fill="#a78bfa">STATION</text>

  <!-- Divider -->
  <line x1="200" y1="278" x2="480" y2="278" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Feature pills -->
  <rect x="80" y="298" width="150" height="26" rx="13" fill="#ffffff" fill-opacity="0.05"/>
  <text x="155" y="315" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#94a3b8">Multi-Station</text>

  <rect x="244" y="298" width="192" height="26" rx="13" fill="#ffffff" fill-opacity="0.05"/>
  <text x="340" y="315" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#94a3b8">NexGen / ENCO Import</text>

  <rect x="450" y="298" width="150" height="26" rx="13" fill="#ffffff" fill-opacity="0.05"/>
  <text x="525" y="315" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#94a3b8">All Pro Features</text>

  <!-- Price -->
  <text x="340" y="362" text-anchor="middle"
    font-family="'DM Mono', 'Courier New', monospace"
    font-size="16" font-weight="500"
    fill="#475569">$79 / month</text>
</svg>
</body>
</html>
